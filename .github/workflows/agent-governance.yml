name: Agent governance

on:
  pull_request:
  push:
    branches:
      - main
      - codex/agent-reliability-main
      - "codex/agent-reliability-*"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate execution plans
        shell: bash
        run: |
          python -c "from pathlib import Path; Path('agent/research_evidence/governance/execplan_validation.json').unlink(missing_ok=True)"
          python scripts/validate_execplans.py --format json --output agent/research_evidence/governance/execplan_validation.json
      - name: Run offline governance tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_governance_tests.py 2>&1 | tee agent/research_evidence/governance/governance_tests.txt
      - name: Upload plan validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-governance-plan-validation
          if-no-files-found: error
          path: agent/research_evidence/governance/execplan_validation.json
      - name: Upload governance test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-governance-tests
          if-no-files-found: error
          path: agent/research_evidence/governance/governance_tests.txt
